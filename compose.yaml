services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velour
      POSTGRES_USER: velour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velour -d velour"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.31.252.5

  migrate:
    build: .
    env_file: .env
    environment: &api_environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://velour:${POSTGRES_PASSWORD}@db:5432/velour
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY}
      APP_URL: ${APP_URL:?configure APP_URL with HTTPS}
      CORS_ORIGINS: ${APP_URL}
      UPLOAD_DIR: /data/uploads
      SCHEDULER_ENABLED: "true"
      AUTO_CREATE_TABLES: "false"
      TZ: ${SALON_TIMEZONE:-America/Sao_Paulo}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment: *api_environment
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--root-path", "/api", "--proxy-headers", "--forwarded-allow-ips", "172.31.252.3"]
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        ipv4_address: 172.31.252.2

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.31.252.3

volumes:
  postgres_data:
  uploads_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.252.0/28
