services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velour
      POSTGRES_USER: velour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velour -d velour"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://velour:${POSTGRES_PASSWORD}@db:5432/velour
      SECRET_KEY: ${SECRET_KEY:?configure SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /data/uploads
      SCHEDULER_ENABLED: "true"
      AUTO_CREATE_TABLES: "false"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
