name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          SCHEDULER_ENABLED: "false"
        run: python -m pytest tests/ -v

      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Validate database migrations
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite:///./migration_ci.db
          AUTO_CREATE_TABLES: "false"
        run: |
          alembic upgrade c4f1a9d7e2b0
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  postgres:
    name: PostgreSQL migrations, isolation and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: velour_ci
          POSTGRES_USER: velour
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velour -d velour_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgresql+psycopg://velour:ci-password@localhost:5432/velour_ci
      TEST_POSTGRES_URL: postgresql+psycopg://velour:ci-password@localhost:5432/velour_ci
      AUTO_CREATE_TABLES: "false"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Migrate and verify schema
        run: |
          alembic upgrade head
          alembic check
      - name: Exercise real PostgreSQL isolation and business dashboards
        run: python -m pytest tests/test_postgres_tenancy.py -v
      - name: Restore backup into a separate database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U velour -d velour_ci -Fc > /tmp/velour-ci.dump
          docker exec "$PG_CONTAINER" createdb -U velour velour_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U velour -d velour_restore --exit-on-error < /tmp/velour-ci.dump
          docker exec "$PG_CONTAINER" psql -U velour -d velour_restore -v ON_ERROR_STOP=1 -c 'SELECT version_num FROM alembic_version; SELECT count(*) FROM tenants;'

  deployment:
    name: Container startup and backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://app.example.com
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate and start containers
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run --rm -e DOMAIN=localhost -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose up -d --build --wait --wait-timeout 180
      - name: Verify API, SPA and exclusive runtime lease
        run: |
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/signup
          curl --fail 'http://127.0.0.1:8080/reset-password?token=ci-reset-secret-sentinel'
          if docker compose logs web | grep -F 'ci-reset-secret-sentinel'; then exit 1; fi
          docker compose exec -T api python -c 'from database import engine; from runtime_guard import RuntimeGuard; guard = RuntimeGuard(); locked = False
          try: guard.acquire(engine)
          except RuntimeError: locked = True
          assert locked, "A second API process acquired the lease"'
      - name: Exercise consistent backup script
        run: |
          python scripts/backup.py --directory /tmp/velour-backups
          test -n "$(find /tmp/velour-backups -name manifest.json -print -quit)"
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
