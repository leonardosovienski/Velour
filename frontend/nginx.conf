limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
log_format velour_safe '$remote_addr - $request_method $uri $server_protocol '
                       '$status $body_bytes_sent $request_time';
map "$realip_remote_addr:$http_x_forwarded_proto" $velour_forwarded_proto {
    default $scheme;
    "172.31.252.4:https" https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log velour_safe;
    client_max_body_size 11m;
    set_real_ip_from 172.31.252.4;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header Cache-Control "no-cache";

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only the fixed Caddy address is trusted for the original client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $velour_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
